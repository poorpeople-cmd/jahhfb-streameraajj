name: VPN FFmpeg Facebook Live

on:
  workflow_dispatch:
    inputs:
      fb_stream_key:
        description: 'Facebook Stream Key'
        required: true
        type: string
      duration_minutes:
        description: 'Stream ka time (Minutes mein)'
        required: true
        default: '120'
        type: string

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install FFmpeg & Cloudflare WARP (Free VPN)
        run: |
          echo "⚙️ FFmpeg aur VPN install ho raha hai..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl gnupg lsb-release
          
          # Cloudflare WARP (VPN) Repository Add karna
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          
          # VPN Connect karna
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 5
          
          echo "🌐 VPN Connect ho gaya! Naya IP Address yeh hai:"
          curl -s ifconfig.me
          echo ""

      - name: Start Live Stream to Facebook
        env:
          FB_KEY: ${{ github.event.inputs.fb_stream_key }}
          DURATION: ${{ github.event.inputs.duration_minutes }}
        run: |
          echo "🚀 VPN ke zariye Facebook Live start ho raha hai..."
          
          timeout $((DURATION * 60)) bash -c '
            while true; do
              echo "🎥 Streaming start ho rahi hai..."
              
              ffmpeg -y \
                -headers "Referer: https://playerdee.top/"$'\r\n'"Origin: https://playerdee.top"$'\r\n'"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"$'\r\n' \
                -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
                -rw_timeout 15000000 \
                -i "https://dz5.bhalocast.pro:7059/hls/itv444.m3u8?md5=u5A_6PUl-hTjS4am7QCbOQ&expires=1794261612&ch=itv444&s=d273e2fbf3655592219a6c0a4baab715" \
                -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
                -pix_fmt yuv420p -g 60 -r 30 \
                -c:a aac -b:a 128k -ar 44100 -f flv \
                "rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
              
              echo "⚠️ Connection toota! 5 seconds mein retry ho raha hai..."
              sleep 5
            done
          ' || true
          
          echo "✅ Stream mukammal ho gayi."
