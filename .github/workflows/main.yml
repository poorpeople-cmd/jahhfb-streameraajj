





name: VLC to FFmpeg Live (Facebook & OK.ru)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Broadcast Platform chunein'
        required: true
        default: 'okru'
        type: choice
        options:
          - okru
          - facebook
          - both
      m3u8_url:
        description: 'M3U8 Stream Link'
        required: true
        default: 'https://dz5.bhalocast.pro:7059/hls/itv444.m3u8?md5=u5A_6PUl-hTjS4am7QCbOQ&expires=1794261612&ch=itv444&s=d273e2fbf3655592219a6c0a4baab715'
        type: string
      http_referrer:
        description: 'HTTP Referrer URL (Default set hai)'
        required: true
        default: 'https://playerdee.top/'
        type: string
      http_origin:
        description: 'HTTP Origin URL (Default set hai)'
        required: true
        default: 'https://playerdee.top'
        type: string
      okru_preset_channel:
        description: 'OK.ru Preset Channel ID (e.g. 1, 1.1, 2, 3, s1.1) - Custom key ke liye khali chhor dein'
        required: false
        default: '1'
        type: string
      custom_stream_key:
        description: 'Custom Stream Key (Facebook Key ya Custom OK.ru Key)'
        required: false
        default: ''
        type: string
      video_quality:
        description: 'Stream Quality & Bitrate'
        required: true
        default: '720p (2500k)'
        type: choice
        options:
          - 480p (1500k)
          - 720p (2500k)
          - 1080p (4500k)
      duration_minutes:
        description: 'Stream ka time (Minutes mein)'
        required: true
        default: '350'
        type: string

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install VLC aur FFmpeg
        run: |
          echo "⚙️ VLC aur FFmpeg install ho rahe hain..."
          sudo apt-get update
          sudo apt-get install -y vlc ffmpeg

      - name: Start Live Stream (VLC -> FFmpeg -> FB / OK.ru)
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          M3U8_URL: ${{ github.event.inputs.m3u8_url }}
          REFERRER: ${{ github.event.inputs.http_referrer }}
          ORIGIN: ${{ github.event.inputs.http_origin }}
          OKRU_CHANNEL: ${{ github.event.inputs.okru_preset_channel }}
          CUSTOM_KEY: ${{ github.event.inputs.custom_stream_key }}
          QUALITY: ${{ github.event.inputs.video_quality }}
          DURATION: ${{ github.event.inputs.duration_minutes }}
        run: |
          # 1. OK.ru Preset Keys Mapping (Aapke script se)
          declare -A OK_KEYS=(
            ["1"]="15254238731883_15281627925099_najspfkgne"
            ["1.1"]="15254260751979_15281671637611_2plrcfqzze"
            ["1.2"]="15254285524587_15281717840491_7e6qdknzsu"
            ["1.3"]="16983200374379_18360218880619_efmw4fchxm"
            ["1.4"]="16983242579563_18360288741995_t2kh2jvcym"
            ["1.5"]="16983247822443_18360297982571_3zs5ml7gua"
            ["1.6"]="16983254834795_18360310237803_xrz3pf4uea"
            ["1.7"]="16983259553387_18360317971051_6khoe5efge"
            ["1.8"]="16983264468587_18360327342699_wsn7zgr7ee"
            ["1.9"]="16983269514859_18360335075947_363qzjlbte"
            ["1.10"]="16983277641323_18360347921003_rpf6hkqpdm"
            ["1.11"]="16983286554219_18360360503915_lrqraxbz3y"
            ["2"]="15254299352683_15281743071851_7dvz3h5d7q"
            ["2.1"]="15254308986475_15281761618539_3xca7oij3u"
            ["2.2"]="15254328122987_15281795566187_zjqa6bqzoq"
            ["3"]="15254341885547_15281821059691_hhlpb5vicy"
            ["3.1"]="15254357089899_15281848322667_sxeexgvzl4"
            ["3.2"]="15254367510123_15281868180075_pc4jrytfgm"
            ["3.3"]="17485986405995_19233134873195_iw63xjblny"
            ["3.4"]="17485996039787_19233150929515_d3yeoweuam"
            ["3.5"]="17486002789995_19233161611883_mbg22slybe"
            ["3.6"]="17486007770731_19233169934955_teme2zt4fm"
            ["4"]="15255022345835_15283095800427_vwrupxzstm"
            ["4.1"]="15255038074475_15283122080363_ai5qqp2we4"
            ["4.2"]="15255045480043_15283135842923_tldl4bhmii"
            ["4.3"]="15255208599147_15283449629291_abltofuc7m"
            ["4.4"]="15255217708651_15283466603115_bojrrqtlmu"
            ["4.5"]="15255227670123_15283486263915_jpntt54mve"
            ["5"]="17135767461483_18625099401835_4gpytlxk4a"
            ["5.1"]="15273713933931_15281743071851_avj47smmim"
            ["5.2"]="15273722257003_15317510195819_6edjluvdqi"
            ["5.3"]="15273739624043_15317541653099_ii4bxpvabe"
            ["5.4"]="15273750175339_15317561707115_csel26ku5a"
            ["5.5"]="15273760071275_15317579467371_cnewcj54me"
            ["5.6"]="15273767935595_15317595851371_3q43tk7tvm"
            ["5.7"]="15273778683499_15317616560747_4piekvs4wu"
            ["s1.1"]="14204232736303_14846150314543_37jq4ryehq"
            ["s1.2"]="14204288179759_14846247373359_tnsknmapva"
            ["s1.3"]="14204319768111_14846302489135_sr4ht4ccwq"
            ["s1.4"]="14204331957807_14846326147631_dji2acqcze"
            ["s1.5"]="14204346572335_14846351641135_7gvns4o5ue"
            ["s1.6"]="14204361252399_14846376479279_cjajhf4d3y"
            ["s1.7"]="14204370492975_14846393649711_6fduhdqite"
            ["s1.8"]="14204395527727_14846438017583_s2jlti7lsm"
            ["s1.9"]="14204411387439_14846464887343_f5lxgcqj5y"
            ["s1.10"]="14204424691247_14846487562799_xmbvntt6wa"
            ["s2.1"]="14204490948143_14846603495983_kzevn36tii"
            ["s2.2"]="14204506742319_14846634494511_ta2rxyg2oy"
            ["s2.3"]="14204523322927_14846661233199_foqb3q7zb4"
            ["s2.4"]="14204540034607_14846689085999_gjejdie4uy"
            ["s2.5"]="14204555304495_14846715497007_zdanghuxzu"
            ["s2.6"]="14204565200431_14846734371375_ap3bqpabpu"
            ["s2.7"]="14204577259055_14846756194863_3ecad2535u"
            ["s2.8"]="14204592528943_14846785227311_4hjl46y62e"
            ["s2.9"]="14204602621487_14846802594351_ilnp6lxekq"
            ["s2.10"]="14206184136239_14849618610735_ihnbx7hkoi"
          )

          # 2. Quality & Bitrate Settings
          if [[ "$QUALITY" == "480p (1500k)" ]]; then
            SCALE="854:480"; BV="1500k"; BUF="3000k"
          elif [[ "$QUALITY" == "1080p (4500k)" ]]; then
            SCALE="1920:1080"; BV="4500k"; BUF="9000k"
          else
            SCALE="1280:720"; BV="2500k"; BUF="5000k"
          fi

          # 3. Stream Key & Destination URL Decide Karna
          SELECTED_OK_KEY="${OK_KEYS[$OKRU_CHANNEL]}"
          if [[ -z "$SELECTED_OK_KEY" ]]; then
            SELECTED_OK_KEY="${OK_KEYS["1"]}"
          fi

          if [[ "$PLATFORM" == "okru" ]]; then
            FINAL_KEY="${CUSTOM_KEY:-$SELECTED_OK_KEY}"
            RTMP_OUTPUT="rtmp://vsu.okcdn.ru/input/$FINAL_KEY"
            echo "📡 Target Platform: OK.ru (Channel: $OKRU_CHANNEL)"
          elif [[ "$PLATFORM" == "facebook" ]]; then
            if [[ -z "$CUSTOM_KEY" ]]; then
              echo "❌ Error: Facebook Live ke liye 'custom_stream_key' mein FB Stream Key dalna zaroori hai!"
              exit 1
            fi
            RTMP_OUTPUT="rtmps://live-api-s.facebook.com:443/rtmp/$CUSTOM_KEY"
            echo "📡 Target Platform: Facebook Live"
          fi

          export RTMP_OUTPUT SCALE BV BUF SELECTED_OK_KEY

          echo "🚀 Stream Start Ho Raha Hai | Quality: $QUALITY | Referrer: $REFERRER | Origin: $ORIGIN"

          timeout $((DURATION * 60)) bash -c '
            while true; do
              echo "🎥 VLC stream buffer kar raha hai aur FFmpeg push kar raha hai..."

              if [[ "$PLATFORM" == "both" ]]; then
                # Dono platforms (OK.ru + Facebook) par ek saath stream bhejne ke liye tee muxer
                cvlc --network-caching=8000 \
                  --http-referrer="$REFERRER" \
                  --http-user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36" \
                  "$M3U8_URL" \
                  --sout "#std{access=file,mux=ts,dst=-}" vlc://quit | \
                ffmpeg -y -thread_queue_size 2048 -i - \
                  -vf "scale=$SCALE" \
                  -c:v libx264 -preset veryfast -b:v "$BV" -maxrate "$BV" -bufsize "$BUF" \
                  -pix_fmt yuv420p -g 60 -r 30 \
                  -c:a aac -b:a 128k -ar 44100 \
                  -f tee -map 0:v -map 0:a "[f=flv]rtmp://vsu.okcdn.ru/input/$SELECTED_OK_KEY|[f=flv]rtmps://live-api-s.facebook.com:443/rtmp/$CUSTOM_KEY"
              else
                # Single Platform (OK.ru YA Facebook)
                cvlc --network-caching=8000 \
                  --http-referrer="$REFERRER" \
                  --http-user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36" \
                  "$M3U8_URL" \
                  --sout "#std{access=file,mux=ts,dst=-}" vlc://quit | \
                ffmpeg -y -thread_queue_size 2048 -i - \
                  -vf "scale=$SCALE" \
                  -c:v libx264 -preset veryfast -b:v "$BV" -maxrate "$BV" -bufsize "$BUF" \
                  -pix_fmt yuv420p -g 60 -r 30 \
                  -c:a aac -b:a 128k -ar 44100 -f flv \
                  "$RTMP_OUTPUT"
              fi

              echo "⚠️ Connection toota! 5 seconds mein retry ho raha hai..."
              sleep 5
            done
          ' || true

          echo "✅ Stream mukammal ho gayi."


































































