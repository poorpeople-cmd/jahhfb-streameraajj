name: VLC to FFmpeg Facebook Live

on:
  workflow_dispatch:
    inputs:
      fb_stream_key:
        description: 'Facebook Stream Key'
        required: true
        type: string
      duration_minutes:
        description: 'Stream ka time (Minutes mein)'
        required: true
        default: '120'
        type: string

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install VLC aur FFmpeg
        run: |
          echo "⚙️ VLC aur FFmpeg install ho rahe hain..."
          sudo apt-get update
          sudo apt-get install -y vlc ffmpeg

      - name: Start Live Stream (VLC -> FFmpeg)
        env:
          FB_KEY: ${{ github.event.inputs.fb_stream_key }}
          DURATION: ${{ github.event.inputs.duration_minutes }}
        run: |
          echo "🚀 VLC Network Cache ke zariye Facebook Live start ho raha hai..."
          
          timeout $((DURATION * 60)) bash -c '
            while true; do
              echo "🎥 VLC stream ko buffer kar raha hai aur FFmpeg Facebook par bhej raha hai..."
              
              # cvlc (Headless VLC) se stream open kar ke FFmpeg ko pipe karna
              cvlc --network-caching=8000 \
                --http-referrer="https://playerdee.top/" \
                --http-origin="https://playerdee.top" \
                --http-user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36" \
                "https://dz5.bhalocast.pro:7059/hls/itv444.m3u8?md5=u5A_6PUl-hTjS4am7QCbOQ&expires=1794261612&ch=itv444&s=d273e2fbf3655592219a6c0a4baab715" \
                --sout "#std{access=file,mux=ts,dst=-}" vlc://quit | \
              ffmpeg -y -thread_queue_size 2048 -i - \
                -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
                -pix_fmt yuv420p -g 60 -r 30 \
                -c:a aac -b:a 128k -ar 44100 -f flv \
                "rtmps://live-api-s.facebook.com:443/rtmp/$FB_KEY"
              
              echo "⚠️ Connection toota! 5 seconds mein retry ho raha hai..."
              sleep 5
            done
          ' || true
          
          echo "✅ Stream mukammal ho gayi."
